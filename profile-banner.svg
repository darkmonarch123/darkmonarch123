<svg width="1600" height="480" viewBox="0 0 1600 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1600" height="480" rx="14"/>
    </clipPath>
  </defs>

  <!-- outer border -->
  <rect x="1" y="1" width="1598" height="478" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <g clip-path="url(#cardClip)">
    <!-- branch tab -->
    <rect x="0" y="0" width="1600" height="56" fill="#161b22"/>
    <rect x="0" y="55" width="1600" height="1" fill="#30363d"/>
    <text x="32" y="35" font-family="SFMono-Regular, Consolas, monospace" font-size="18" fill="#8b949e">main</text>

    <!-- main content -->
    <text x="32" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#f0f6fc">Temiloluwa E.</text>
    <text x="32" y="200" font-family="SFMono-Regular, Consolas, monospace" font-size="26" font-weight="600" letter-spacing="1" fill="#3fb950">Software Engineer</text>
    <text x="32" y="248" font-family="SFMono-Regular, Consolas, monospace" font-size="20" fill="#8b949e">React &#183; Node.js &#183; Python &#183; Solidity &#183; AI/ML</text>

    <!-- terminal mock, right side -->
    <g transform="translate(1180,90)">
      <rect x="0" y="0" width="360" height="220" rx="10" fill="#010409" stroke="#30363d" stroke-width="2"/>
      <rect x="0" y="0" width="360" height="28" rx="10" fill="#161b22"/>
      <rect x="0" y="14" width="360" height="14" fill="#161b22"/>
      <circle cx="20" cy="14" r="5" fill="#ff5f56"/>
      <circle cx="40" cy="14" r="5" fill="#ffbd2e"/>
      <circle cx="60" cy="14" r="5" fill="#27c93f"/>
      <text x="20" y="60" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#3fb950">$ whoami</text>
      <text x="20" y="88" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#c9d1d9">temiloluwa</text>
      <text x="20" y="116" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#3fb950">$ status</text>
      <text x="20" y="144" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#c9d1d9">available for work</text>
      <text x="20" y="172" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#3fb950">$ location</text>
      <text x="20" y="200" font-family="SFMono-Regular, Consolas, monospace" font-size="15" fill="#c9d1d9">Lagos, Nigeria</text>
    </g>

    <!-- version tag -->
    <text x="1568" y="460" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="16" fill="#484f58">v1.0.0</text>

    <!-- bottom divider -->
    <rect x="0" y="330" width="1600" height="1" fill="#21262d"/>

    <!-- quote bar -->
    <rect x="32" y="360" width="1536" height="72" rx="8" fill="#010409" stroke="#21262d" stroke-width="1"/>
    <text x="56" y="404" font-family="SFMono-Regular, Consolas, monospace" font-size="20" fill="#3fb950">&gt;</text>
    <text x="82" y="404" font-family="SFMono-Regular, Consolas, monospace" font-size="20" fill="#c9d1d9">Turning complexity into a product people can actually use</text>
  </g>
</svg>
